[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ticketops*"]

[project]
name = "ticketops-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<3", "alembic>=1.15,<2", "psycopg[binary]>=3.2,<4", "httpx>=0.28,<1", "pydantic-settings>=2.8,<3", "scikit-learn>=1.6,<2", "joblib>=1.4,<2", "rank-bm25>=0.2,<1", "numpy>=2,<3"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8"]
training = ["torch>=2.6,<3", "transformers>=4.50,<5", "datasets>=3,<5", "accelerate>=1,<2"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
